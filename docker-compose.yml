version: '3.9'

services:
  bank_app:
    container_name: bank-app
    build: .
    image: bank-account-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - bank_db

  bank_db:
    container_name: bank_db
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: admin
